// Used only by run-subgame-tests.ps1; ordinary builds retain the complete test source set. The card tests
// it runs live in the per-letter magical-vibes-card-test modules, so only service/architecture tests are kept here.
gradle.beforeProject { project ->
    if (project.name == 'magical-vibes-application') {
        project.afterEvaluate {
            project.tasks.named('compileTestJava') {
                setSource(project.fileTree('src/test/java') {
                    include '**/service/**'
                    include '**/architecture/SimulationCopyCompletenessTest.java'
                })
            }
        }
    }
}

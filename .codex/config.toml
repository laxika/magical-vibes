[[approval_rules]]
# Matches any gradlew command targeting the application test suite
command_pattern = "^./gradlew :magical-vibes-application:test --tests .*"
decision = "always-allow"
reason = "Allow targeted application tests to manage Gradle wrapper locks and artifacts."

[[approval_rules]]
# Matches any gradlew command targeting one per-letter card test module
command_pattern = "^./gradlew :magical-vibes-card-test:[a-z]:test --tests .*"
decision = "always-allow"
reason = "Allow targeted card tests to manage Gradle wrapper locks and artifacts."

[features]
codex_git_commit = true

[sandbox]
# Ensures the sandbox doesn't block Gradle from writing to its own build/cache dirs
mode = "relaxed"
extra_writable_paths = [
    "~/.gradle",
    "./.gradle",
    "./build"
]

[mcp_servers.scryfall]
command = "node"
args = ["mcp/card-info/server.mjs"]
cwd = "."
startup_timeout_sec = 10
tool_timeout_sec = 60

[mcp_servers.rules]
command = "node"
args = ["mcp/rules-info/server.mjs"]
cwd = "."
startup_timeout_sec = 10
tool_timeout_sec = 60

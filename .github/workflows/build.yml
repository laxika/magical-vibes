name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The server's own set-{code}.json files, converted from the MTGJSON downloads the tests
      # make on a cache miss. Every test JVM uses this repo-root directory. It is restored before
      # and saved after the run; restore-keys reuses the previous cache so only missing sets are
      # downloaded.
      - name: Cache oracle set data
        uses: actions/cache@v4
        with:
          path: card-data-cache
          key: card-data-cache-v2-${{ hashFiles('magical-vibes-card/core/src/main/java/com/github/laxika/magicalvibes/cards/CardSet.java') }}
          restore-keys: |
            card-data-cache-

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --max-workers=3 -x test -x :magical-vibes-frontend:build -x :magical-vibes-frontend:npmInstall -x :magical-vibes-frontend:buildAngular

      - name: Test
        run: |
          ./gradlew test --max-workers=3 \
            -x :magical-vibes-application:copyFrontend
